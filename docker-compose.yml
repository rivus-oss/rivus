name: rivus

x-rivus-common: &rivus-common
  image: ghcr.io/gerinsp/rivus:${RIVUS_IMAGE_TAG:-latest}
  restart: unless-stopped
  # Must be longer than RIVUS_SHUTDOWN_TIMEOUT_SECONDS so Docker does not
  # SIGKILL snapshot/streaming workers before their checkpoint drain finishes.
  stop_grace_period: ${RIVUS_STOP_GRACE_PERIOD:-2m}
  depends_on:
    meta-mysql:
      condition: service_healthy
  env_file:
    - .env
  environment: &rivus-environment
    TZ: ${TZ:-UTC}
    RIVUS_IMAGE_TAG: ${RIVUS_IMAGE_TAG:-latest}
    RIVUS_SHUTDOWN_TIMEOUT_SECONDS: ${RIVUS_SHUTDOWN_TIMEOUT_SECONDS:-90}
    RIVUS_LOG_ROOT: ${RIVUS_LOG_ROOT:-/app/logs}
    RIVUS_LOG_RETENTION_DAYS: ${RIVUS_LOG_RETENTION_DAYS:-7}
    RIVUS_LOG_MAX_SIZE_MB: ${RIVUS_LOG_MAX_SIZE_MB:-64}
    RIVUS_LOG_MAX_TOTAL_SIZE_MB: ${RIVUS_LOG_MAX_TOTAL_SIZE_MB:-2048}
    # Streaming/maintenance logs can be very noisy. Keep them in Rivus'
    # rotating files by default rather than duplicating them into Docker logs.
    RIVUS_LOG_STDERR: ${RIVUS_LOG_STDERR:-false}
  logging:
    driver: json-file
    options:
      max-size: "64m"
      max-file: "5"

services:
  meta-mysql:
    image: mysql:8.0
    container_name: rivus-meta-mysql
    restart: unless-stopped
    env_file:
      - .env
    entrypoint:
      - sh
      - /bootstrap/mysql-meta-entrypoint.sh
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS:-rivus-root-pass}
      MYSQL_DATABASE: ${RIVUS_META_MYSQL_DATABASE:-rivus_meta}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "${RIVUS_META_MYSQL_PORT:-43306}:3306"
    volumes:
      - meta-mysql-data:/var/lib/mysql
      - ./mysql-bootstrap-user.sh:/bootstrap/mysql-bootstrap-user.sh:ro
      - ./mysql-meta-entrypoint.sh:/bootstrap/mysql-meta-entrypoint.sh:ro

  rivus-master:
    <<: *rivus-common
    command: ["/app/rivus", "master"]
    environment:
      <<: *rivus-environment
      RIVUS_API_TOKEN: ${RIVUS_API_TOKEN:-}
      RIVUS_LOG_DIR: ${RIVUS_MASTER_LOG_DIR:-/app/logs/master}
      RIVUS_LOG_PREFIX: rivus
    ports:
      - "${RIVUS_HTTP_PORT:-8080}:8080"
    volumes:
      - ./ui:/app/ui:ro
      # One shared volume, organized by role below /app/logs.
      - ./logs:/app/logs

  rivus-streaming:
    <<: *rivus-common
    command: ["/app/rivus", "streaming-worker"]
    environment:
      <<: *rivus-environment
      # Leave empty by default so Rivus uses its unique hostname-pid identity.
      # Set RIVUS_STREAMING_WORKER_ID only when you can guarantee uniqueness.
      RIVUS_WORKER_ID: ${RIVUS_STREAMING_WORKER_ID:-}
      RIVUS_ICEBERG_MAX_CONCURRENT_COMMITS: ${RIVUS_ICEBERG_MAX_CONCURRENT_COMMITS:-3}
      RIVUS_LOG_DIR: ${RIVUS_STREAMING_LOG_DIR:-/app/logs/streaming}
      RIVUS_LOG_PREFIX: rivus-streaming
    volumes:
      - ./logs:/app/logs

  rivus-snapshot:
    <<: *rivus-common
    command: ["/app/rivus", "snapshot-worker"]
    environment:
      <<: *rivus-environment
      RIVUS_WORKER_ID: ${RIVUS_SNAPSHOT_WORKER_ID:-}
      RIVUS_ICEBERG_MAX_CONCURRENT_COMMITS: ${RIVUS_ICEBERG_MAX_CONCURRENT_COMMITS:-3}
      RIVUS_LOG_DIR: ${RIVUS_SNAPSHOT_LOG_DIR:-/app/logs/snapshot}
      RIVUS_LOG_PREFIX: rivus-snapshot
    volumes:
      - ./logs:/app/logs
      - snapshot-spool:/var/lib/rivus/snapshot-spool

  rivus-maintenance:
    <<: *rivus-common
    command: ["/app/rivus", "maintenance-worker", "--queue"]
    environment:
      <<: *rivus-environment
      RIVUS_WORKER_ID: ${RIVUS_MAINTENANCE_WORKER_ID:-}
      RIVUS_MAINTENANCE_MAX_DISCOVERED_TABLES: ${RIVUS_MAINTENANCE_MAX_DISCOVERED_TABLES:-10000}
      RIVUS_LOG_DIR: ${RIVUS_MAINTENANCE_LOG_DIR:-/app/logs/maintenance}
      RIVUS_LOG_PREFIX: rivus-maintenance
    volumes:
      - ./logs:/app/logs

volumes:
  meta-mysql-data:
  snapshot-spool:
